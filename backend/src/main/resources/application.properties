spring.application.name=guaxiLivery

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guaxelivery}
spring.datasource.username=${DB_USER:guaxelivery}
spring.datasource.password=${DB_PASSWORD:guaxelivery123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (troque o segredo em producao; minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:guaxilivery-dev-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

# Upload das imagens de comida
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=300MB

# CORS (front end Next.js)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Fuso usado para agrupar o financeiro por dia/mes
app.finance.zone=${FINANCE_ZONE:America/Sao_Paulo}
